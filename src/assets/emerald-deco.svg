<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 260">
  <title>Emerald</title>
  <!-- An emerald-cut gem in the Art Deco style: stepped outlines in gold, facets
       running from the girdle to the table. -->
  <defs>
    <linearGradient id="gemFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3fcf9b"/>
      <stop offset="0.5" stop-color="#0f7a57"/>
      <stop offset="1" stop-color="#063d2c"/>
    </linearGradient>
  </defs>
  <polygon points="40,0 160,0 200,40 200,220 160,260 40,260 0,220 0,40" fill="url(#gemFill)" stroke="#d9b45a" stroke-width="8"/>
  <polygon points="56,22 144,22 178,56 178,204 144,238 56,238 22,204 22,56" fill="none" stroke="#d9b45a" stroke-width="3" opacity="0.8"/>
  <polygon points="72,46 128,46 154,72 154,188 128,214 72,214 46,188 46,72" fill="rgba(255,255,255,0.08)" stroke="#d9b45a" stroke-width="3"/>
  <g stroke="#d9b45a" stroke-width="2.5" opacity="0.7">
    <line x1="40" y1="0" x2="72" y2="46"/><line x1="160" y1="0" x2="128" y2="46"/>
    <line x1="200" y1="40" x2="154" y2="72"/><line x1="200" y1="220" x2="154" y2="188"/>
    <line x1="160" y1="260" x2="128" y2="214"/><line x1="40" y1="260" x2="72" y2="214"/>
    <line x1="0" y1="220" x2="46" y2="188"/><line x1="0" y1="40" x2="46" y2="72"/>
  </g>
</svg>
